name: Release fnOS FPK App

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Vue Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Extract Version
        id: get_version
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}"
          # Strip leading 'v'
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building with target version: $VERSION"

      - name: Build fnOS .fpk Packages
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          node scripts/build_fpk.js

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist_fpk/*.fpk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
